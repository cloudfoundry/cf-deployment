- type: replace
  path: /addons?/-
  value:
    include:
      stemcell:
      - os: ubuntu-bionic
      - os: ubuntu-jammy
      - os: ubuntu-noble
      - os: ubuntu-resolute
    jobs:
    - name: syslog_forwarder
      properties:
        syslog:
          address: ((syslog_address))
          custom_rule: |
            ((syslog_custom_rule))
            if ($programname startswith "vcap.") then stop
          fallback_servers: ((syslog_fallback_servers))
          permitted_peer: ((syslog_permitted_peer))
          port: ((syslog_port))
          tls_enabled: true
          transport: tcp
      release: syslog
    name: syslog_forwarder
- type: replace
  path: /releases/-
  value:
    name: syslog
    sha1: sha256:fa42b97aec98c174752c15847a0383bd5b64da067dee0852e70a9a9b4cc130a3
    url: https://bosh.io/d/github.com/cloudfoundry/syslog-release?v=12.3.31
    version: 12.3.31
