      cflinuxfs4-rootfs:
        trusted_certs:
        - ((diego_instance_identity_ca.ca))
        - ((credhub_tls.ca))
        - ((uaa_ssl.ca))
    release: cflinuxfs4-compat
- type: replace
  path: /releases/name=cflinuxfs4
  value:
    name: cflinuxfs4-compat
    sha1: sha256:15a5d3ba34c074914c7571f9ac33feae11bd8d93e3cf59569850aa7d18d91398
    url: https://bosh.io/d/github.com/cloudfoundry/cflinuxfs4-compat-release?v=1.322.0
