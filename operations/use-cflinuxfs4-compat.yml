- type: replace
  path: /instance_groups/name=diego-cell/jobs/name=cflinuxfs4-rootfs-setup?
  value:
    name: cflinuxfs4-rootfs-setup
    properties:
      cflinuxfs4-rootfs:
        trusted_certs:
        - ((diego_instance_identity_ca.ca))
        - ((credhub_tls.ca))
        - ((uaa_ssl.ca))
    release: cflinuxfs4-compat
- type: replace
  path: /releases/name=cflinuxfs4
  value:
    name: cflinuxfs4-compat
    sha1: sha256:c19f70640d08e13529432fa29452b03ecb94632738313278f7ebc53c1f3f814e
    url: https://bosh.io/d/github.com/cloudfoundry/cflinuxfs4-compat-release?v=1.335.0
    version: 1.335.0
