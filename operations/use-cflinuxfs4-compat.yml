- type: replace
  path: /instance_groups/name=diego-cell/jobs/name=cflinuxfs4-rootfs-setup?
  value:
    name: cflinuxfs4-rootfs-setup
    properties:
      cflinuxfs4-rootfs:
        trusted_certs:
        - ((diego_instance_identity_ca.ca))
        - ((credhub_tls.ca))
        - ((uaa_ssl.ca))
    release: cflinuxfs4-compat
- type: replace
  path: /releases/name=cflinuxfs4
  value:
    name: cflinuxfs4-compat
    sha1: sha256:21dcdbf71840c3787f0dcd42e87d91621b2be7873a150e758991d2c4d9c3ee10
    url: https://bosh.io/d/github.com/cloudfoundry/cflinuxfs4-compat-release?v=1.333.0
    version: 1.333.0
