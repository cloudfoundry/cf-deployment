- type: replace
  path: /instance_groups/name=diego-cell/jobs/name=cflinuxfs4-rootfs-setup?
  value:
    name: cflinuxfs4-rootfs-setup
    properties:
      cflinuxfs4-rootfs:
        trusted_certs:
        - ((diego_instance_identity_ca.ca))
        - ((credhub_tls.ca))
        - ((uaa_ssl.ca))
    release: cflinuxfs4-compat
- type: replace
  path: /releases/name=cflinuxfs4
  value:
    name: cflinuxfs4-compat
    sha1: sha256:5508f9f5697d77387fa227f43ddda20243d1da12f8ef975538f9b4b5912dc070
    url: https://bosh.io/d/github.com/cloudfoundry/cflinuxfs4-compat-release?v=1.339.0
    version: 1.339.0
