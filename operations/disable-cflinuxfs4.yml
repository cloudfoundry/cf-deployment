---
# Apply operations/experimental/set-cflinuxfs5-default-stack.yml before this
# ops file so Cloud Controller no longer uses cflinuxfs4 as its default stack.
# If using an isolation segment, apply this after
# operations/add-persistent-isolation-segment-diego-cell.yml as well.
- type: remove
  path: /instance_groups/name=api/jobs/name=cloud_controller_ng/properties/cc/stacks/name=cflinuxfs4
- type: remove
  path: /instance_groups/name=api/jobs/name=cloud_controller_ng/properties/cc/install_buildpacks/package=staticfile-buildpack-cflinuxfs4
- type: remove
  path: /instance_groups/name=api/jobs/name=cloud_controller_ng/properties/cc/install_buildpacks/package=java-buildpack-cflinuxfs4
- type: remove
  path: /instance_groups/name=api/jobs/name=cloud_controller_ng/properties/cc/install_buildpacks/package=ruby-buildpack-cflinuxfs4
- type: remove
  path: /instance_groups/name=api/jobs/name=cloud_controller_ng/properties/cc/install_buildpacks/package=dotnet-core-buildpack-cflinuxfs4
- type: remove
  path: /instance_groups/name=api/jobs/name=cloud_controller_ng/properties/cc/install_buildpacks/package=nodejs-buildpack-cflinuxfs4
- type: remove
  path: /instance_groups/name=api/jobs/name=cloud_controller_ng/properties/cc/install_buildpacks/package=go-buildpack-cflinuxfs4
- type: remove
  path: /instance_groups/name=api/jobs/name=cloud_controller_ng/properties/cc/install_buildpacks/package=python-buildpack-cflinuxfs4
- type: remove
  path: /instance_groups/name=api/jobs/name=cloud_controller_ng/properties/cc/install_buildpacks/package=php-buildpack-cflinuxfs4
- type: remove
  path: /instance_groups/name=api/jobs/name=cloud_controller_ng/properties/cc/install_buildpacks/package=nginx-buildpack-cflinuxfs4
- type: remove
  path: /instance_groups/name=api/jobs/name=cloud_controller_ng/properties/cc/install_buildpacks/package=r-buildpack-cflinuxfs4
- type: remove
  path: /instance_groups/name=api/jobs/name=cloud_controller_ng/properties/cc/install_buildpacks/package=binary-buildpack-cflinuxfs4
- type: remove
  path: /instance_groups/name=api/jobs/name=cloud_controller_ng/properties/cc/diego/droplet_destinations/cflinuxfs4
- type: remove
  path: /instance_groups/name=api/jobs/name=cloud_controller_ng/properties/cc/diego/lifecycle_bundles/buildpack~1cflinuxfs4
- type: remove
  path: /instance_groups/name=api/jobs/name=cloud_controller_ng/properties/cc/diego/lifecycle_bundles/cnb~1cflinuxfs4
- type: remove
  path: /instance_groups/name=cc-worker/jobs/name=cloud_controller_worker/properties/cc/diego/droplet_destinations/cflinuxfs4
- type: remove
  path: /instance_groups/name=cc-worker/jobs/name=cloud_controller_worker/properties/cc/diego/lifecycle_bundles/buildpack~1cflinuxfs4
- type: remove
  path: /instance_groups/name=cc-worker/jobs/name=cloud_controller_worker/properties/cc/diego/lifecycle_bundles/cnb~1cflinuxfs4
- type: remove
  path: /instance_groups/name=scheduler/jobs/name=cloud_controller_clock/properties/cc/diego/droplet_destinations/cflinuxfs4
- type: remove
  path: /instance_groups/name=scheduler/jobs/name=cloud_controller_clock/properties/cc/diego/lifecycle_bundles/buildpack~1cflinuxfs4
- type: remove
  path: /instance_groups/name=scheduler/jobs/name=cloud_controller_clock/properties/cc/diego/lifecycle_bundles/cnb~1cflinuxfs4
- type: remove
  path: /instance_groups/name=scheduler/jobs/name=cc_deployment_updater/properties/cc/diego/droplet_destinations/cflinuxfs4
- type: remove
  path: /instance_groups/name=scheduler/jobs/name=cc_deployment_updater/properties/cc/diego/lifecycle_bundles/buildpack~1cflinuxfs4
- type: remove
  path: /instance_groups/name=scheduler/jobs/name=cc_deployment_updater/properties/cc/diego/lifecycle_bundles/cnb~1cflinuxfs4
- type: remove
  path: /instance_groups/name=diego-cell/jobs/name=cflinuxfs4-rootfs-setup
- type: remove
  path: /instance_groups/name=diego-cell/jobs/name=rep/properties/diego/rep/preloaded_rootfses/0
- type: remove
  path: /instance_groups/name=isolated-diego-cell/jobs/name=cflinuxfs4-rootfs-setup?
- type: replace
  path: /instance_groups/name=isolated-diego-cell/jobs/name=rep/properties/diego/rep/preloaded_rootfses?
  value:
  - cflinuxfs5:/var/vcap/packages/cflinuxfs5/rootfs.tar
- type: remove
  path: /releases/name=cflinuxfs4
