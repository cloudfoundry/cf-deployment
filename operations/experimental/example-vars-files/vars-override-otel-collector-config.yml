# Shows how to configure the OTel Collector to export to files, with an optional OTLP/mTLS exporter.
---
otel_collector_config:
  processors:
    batch:

  exporters:
    file/traces:
      path: /tmp/otel-collector-traces.log
    file/metrics:
      path: /tmp/otel-collector-metrics.log
    file/logs:
      path: /tmp/otel-collector-logs.log
    # Replace the endpoint and PEM placeholders before enabling this exporter and its pipeline references.
    # otlp/test:
    #   endpoint: otelcol:4317
    #   tls:
    #     insecure: false
    #     ca_pem: |-
    #       -----BEGIN CERTIFICATE-----
    #       <example server CA>
    #       -----END CERTIFICATE-----
    #     cert_pem: |-
    #       -----BEGIN CERTIFICATE-----
    #       <example client cert>
    #       -----END CERTIFICATE-----
    #     key_pem: |-
    #       -----BEGIN RSA PRIVATE KEY-----
    #       <example client key>
    #       -----END RSA PRIVATE KEY-----

  service:
    pipelines:
      traces:
        receivers: [otlp/cf-internal-local]
        processors: [batch]
        exporters:
        - file/traces
        # - otlp/test
      metrics:
        receivers: [otlp/cf-internal-local]
        processors: [batch]
        exporters:
        - file/metrics
        # - otlp/test
      logs:
        receivers: [otlp/cf-internal-local]
        processors: [batch]
        exporters:
        - file/logs
        # - otlp/test
