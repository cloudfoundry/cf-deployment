# Shows how to configure otel collector to export to file and otlp with mTLS
---
otel_collector_config:
  receivers:
    otlp/placeholder: # no need to change, receivers are filled in automatically by the release

  processors:
    batch:

  exporters:
    file/traces:
      path: /tmp/otel-collector-traces.log
    file/metrics:
      path: /tmp/otel-collector-metrics.log
    file/logs:
      path: /tmp/otel-collector-logs.log
    otlp/test:
      endpoint: otelcol:4317
      tls:
        insecure: false
        ca_pem: |-
          -----BEGIN CERTIFICATE-----
          <example server CA>
          -----END CERTIFICATE-----
        cert_pem: |-
          -----BEGIN CERTIFICATE-----
          <example client cert>
          -----END CERTIFICATE-----
        key_pem: |-
          -----BEGIN RSA PRIVATE KEY-----
          <example client key>
          -----END RSA PRIVATE KEY-----

  service:
    pipelines:
      traces:
        receivers: [otlp/placeholder] # no need to change, receivers are filled in automatically by the release
        processors: [batch]
        exporters:
        - file/traces
        - otlp/test
      metrics:
        receivers: [otlp/placeholder] # no need to change, receivers are filled in automatically by the release
        processors: [batch]
        exporters:
        - file/metrics
        - otlp/test
      logs:
        receivers: [otlp/placeholder] # no need to change, receivers are filled in automatically by the release
        processors: [batch]
        exporters:
        - file/logs
        - otlp/test
