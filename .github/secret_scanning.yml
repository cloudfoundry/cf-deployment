paths-ignore:
  # Test fixture vars-stores — contain generated keys/passwords for unit tests
  - scripts/fixtures/**

  # Spec test assets and fixtures
  - spec/assets/**
  - spec/fixtures/**

  # Bosh-lite local deployment vars — ephemeral dev credentials, not production
  - bosh-lite/deployment-vars.yml
  - bosh-lite/overrides.yml

  # Example vars files — illustrative placeholders, not real secrets
  - operations/example-vars-files/**

  # Transition fixtures — migration test data
  - transition/fixture/**
  - transition/after.yml
